name: Publish Python client

# Publishes clients/python to PyPI via Trusted Publisher (no stored token).
# Exact-SHA proof (Task 20): the commit being published must have passed CI
# before any build, publish, or irreversible write. Human confirmation stays
# but is not treated as quality proof.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the version from clients/python/pyproject.toml to confirm"
        required: true
  push:
    tags: ["py-v*"]

permissions:
  contents: read
  actions: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version matches tag / confirmation
        run: |
          VERSION=$(grep -m1 '^version' clients/python/pyproject.toml | cut -d'"' -f2)
          echo "package version: $VERSION"
          if [[ "$GITHUB_REF" == refs/tags/py-v* ]]; then
            TAG="${GITHUB_REF#refs/tags/py-v}"
            [[ "$TAG" == "$VERSION" ]] || { echo "::error::tag py-v$TAG != package $VERSION"; exit 1; }
          else
            [[ "${{ inputs.confirm }}" == "$VERSION" ]] || { echo "::error::confirmation '${{ inputs.confirm }}' != package $VERSION"; exit 1; }
          fi

  proof:
    name: Exact-SHA CI proof
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/ciproof
            go.mod
            go.sum
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify exact-SHA CI proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          go run ./tools/ciproof \
            --repository "${{ github.repository }}" \
            --sha "$GITHUB_SHA" \
            --output /tmp/proof.json
          cat /tmp/proof.json

  test:
    needs: [check-version, proof]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "clients/python[dev]"
      - run: cd clients/python && python -m pytest -q -m "not contract"

  certify:
    name: Release-certify (contract + smoke-install)
    needs: [check-version, proof]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "clients/python[dev]" build
      - name: Start fixture server
        run: bash scripts/p4-fixture-server.sh | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Contract tests
        run: cd clients/python && python -m pytest -q -m contract
      - name: Stop fixture server
        if: always()
        run: bash scripts/p4-fixture-server.sh --stop
      - name: Build wheel/sdist
        run: cd clients/python && python -m build
      - name: Smoke-install built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install clients/python/dist/*.whl
          /tmp/smoke/bin/python -c "import sagewiki; print('smoke import OK:', sagewiki.__version__)"

  publish:
    needs: [test, certify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: cd clients/python && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin-resolution check (06 §P4-6 required test)
        run: |
          VERSION=$(grep -m1 '^version' clients/python/pyproject.toml | cut -d'"' -f2)
          sleep 30  # PyPI index propagation
          pip install "sagewiki==$VERSION"
          python -c "import sagewiki; assert sagewiki.__version__ == '$VERSION'; print('registry pin resolves:', sagewiki.__version__)"
